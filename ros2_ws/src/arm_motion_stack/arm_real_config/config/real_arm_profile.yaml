schema_version: 1

# This file is intentionally not ready for motion. The populated limits and
# watchdogs are provisional: verify all six axes on hardware, review the
# values, then set calibrated: true.
calibrated: false

hardware:
  can_interface: can1
  baudrate: 0
  encoder_bw: 19
  reduction_ratio: 100.0
  sync_period_us: 0
  controller_update_rate_hz: 50
  read_rate_hz: 50.0
  state_poll_rate_hz: 0.0
  manual_feedback_timeout_ms: 15
  feedback_stale_timeout_ms: 30
  enable_emcy_monitor: true
  # At 50 Hz and 0.05 rad/s, a planned step is about 0.001 rad. This guard
  # allows commissioning margin but rejects discontinuous commands.
  max_command_step_rad: 0.005
  # Match the JTC path tolerance and stop after three distinct feedback sets.
  max_following_error_rad: 0.05
  following_error_cycles: 3
  # The PC publishes a volatile heartbeat at 20 Hz. The board first cancels
  # and deactivates JTC after 250 ms; the hardware plugin escalates a still
  # moving arm to verified CiA402 Quick Stop after 500 ms.
  remote_heartbeat_period_ms: 50
  remote_soft_timeout_ms: 250
  remote_hard_timeout_ms: 500
  remote_stop_velocity_threshold_rad_s: 0.02

joints:
  J1:
    node_id: 1
    position_min: -1.4
    position_max: 1.4
    max_velocity: 0.05
    max_acceleration: 0.10
  J2:
    node_id: 2
    position_min: -1.3
    position_max: 1.3
    max_velocity: 0.05
    max_acceleration: 0.10
  J3:
    node_id: 3
    position_min: -1.3
    position_max: 1.3
    max_velocity: 0.05
    max_acceleration: 0.10
  J4:
    node_id: 4
    position_min: -0.2
    position_max: 1.34
    max_velocity: 0.05
    max_acceleration: 0.10
  J5:
    node_id: 5
    position_min: -1.3
    position_max: 1.3
    max_velocity: 0.05
    max_acceleration: 0.10
  J6:
    node_id: 6
    position_min: -1.2
    position_max: 1.3
    max_velocity: 0.05
    max_acceleration: 0.10
