# Controller configuration for the real miraculous_driver hardware backend.
# Mirrors arm_control/config/ros2_controllers.yaml so the existing
# arm_controller / joint_state_broadcaster stay stable.
controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - J1
      - J2
      - J3
      - J4
      - J5
      - J6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.02
      J1: {trajectory: 0.05, goal: 0.03}
      J2: {trajectory: 0.05, goal: 0.03}
      J3: {trajectory: 0.05, goal: 0.03}
      J4: {trajectory: 0.05, goal: 0.03}
      J5: {trajectory: 0.05, goal: 0.03}
      J6: {trajectory: 0.05, goal: 0.03}
