# Trajectory tracking test parameters.
#
# This file documents all parameters consumed by the trajectory_tracking_test_node.
# Values can be overridden via launch arguments or command-line parameters.
#
# CRITICAL: pulses_per_radian must be filled with the real per-joint values:
#   pulses_per_radian = counts_per_rev * gear_ratio / (2*pi)
trajectory_test:
  ros__parameters:
    # ---- motor / CAN ----
    can_interface: "can0"
    baudrate: 1000
    node_ids: "1,2,3,4,5,6"
    # TODO: replace with real per-joint pulses_per_radian (6 comma-separated values).
    pulses_per_radian: "1000.0,1000.0,1000.0,1000.0,1000.0,1000.0"

    # ---- trajectory ----
    amplitude: 0.5          # [rad] sine/cosine amplitude
    period: 5.0             # [s]   one full cycle
    frequency: 100.0        # [Hz]  command update rate
    waveform: "sin"         # "sin" or "cos"
    test_joint: 0           # 0=J1, 1=J2, ..., 5=J6
    duration: 0.0           # [s] auto-stop (0 = manual via service)
    settle_time: 0.5        # [s] wait before starting trajectory

    # ---- output ----
    output_file: ""          # empty = auto timestamped filename
    joint_states_topic: "/arm_joint_states"
